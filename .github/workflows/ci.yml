name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test deps
        run: python -m pip install pytest

      - name: Skill structure tests
        run: python -m pytest tests -q

      - name: Compile Python tools (job-hunt)
        run: python -m py_compile job-hunt/tools/*.py && echo "tools compile"

      - name: job-hunt tool unit tests
        run: python -m pytest job-hunt/tests -q

      - name: Shell script syntax check
        run: |
          for f in portfolio-audit/scripts/*.sh pr-draft/scripts/*.sh social-media/scripts/*.sh; do
            bash -n "$f" && echo "OK: $f"
          done

      - name: Validate JSON schemas
        run: |
          for f in resume/references/*.json; do
            python -m json.tool "$f" > /dev/null && echo "OK: $f"
          done
